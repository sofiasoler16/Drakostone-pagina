<!doctype html>
<!-- =========================================================
     PÁGINA NO ENCONTRADA (404) — Vercel la muestra sola
     cuando alguien entra a una dirección que no existe.
     ========================================================= -->
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Página no encontrada — Drakostone</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/imagenes/logo/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;700;800&display=swap" />
  <link rel="stylesheet" href="/estilos/base.css" />
  <style>
    main { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; align-content: center; gap: 6px; text-align: center; padding: 24px 16px; }
    main img { width: 150px; height: auto; animation: flotar 4s ease-in-out infinite; }
    h1 { font-size: 64px; margin: 0; color: var(--violeta); }
    p { color: var(--texto-suave); margin: 0 0 18px; max-width: 340px; }
  </style>
</head>
<body>
  <main>
    <img src="/imagenes/dragones/original-animo.webp" alt="" width="347" height="520" />
    <h1>404</h1>
    <p>Uy, el dragón buscó por todos lados y esta página no existe.</p>
    <a class="btn btn-primario" href="/">Volver al inicio</a>
  </main>
</body>
</html>
